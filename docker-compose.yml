services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maxitexs
      POSTGRES_PASSWORD: maxitexs
      POSTGRES_DB: maxitexs_sorteo
      TZ: America/Caracas
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxitexs -d maxitexs_sorteo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
