# Blueprint para Render.com (alternativa a Railway)
# Dashboard → New → Blueprint → selecciona este repo
services:
  - type: web
    name: maxitexs-sorteo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Caracas
      - key: PREMIO
        value: Premio
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Opcional. Si falta o es localhost, la app usa RENDER_EXTERNAL_URL.
      # Recomendado: https://TU-SERVICIO.onrender.com
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: maxitexs-db
          property: connectionString

databases:
  - name: maxitexs-db
    plan: free
    databaseName: maxitexs_sorteo
    user: maxitexs
